<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomo dos Doros</title>
    <link rel="stylesheet" href="./src/css/estilo.css">
    <link rel="icon" type="image/icon-x" href="#">
</head>
<body>
    
    <header><h1>Pomo dos Doros</h1></header>

    <main class="doro-container"> <!-- <-- vai conter o site todo, basicamente -->
        <section id="relogio-container">
            <div id="fundo-relogio">
                <div id="display-relogio">
                    <h2 id="timerText">00:00</h2>
                    <div id="botoes-display">
                        <button type="button" class="btn-relogio" id="btn-play" onclick="">
                            Play
                        </button>
                        <button type="button" class="btn-relogio" id="btn-pause" onclick="">
                            Pause
                        </button>
                        <button type="button" class="btn-relogio" id="btn-reset" onclick="">
                            Reset
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <div>
            <h3>Site muito épico</h3>
            <h4> Alvaro Andrade Santos &copy; - 2025 - Todos os Direitos reservados</h4>
        </div>
    </footer>

</body>
</html>
