<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomo dos Doros</title>
    <link rel="stylesheet" href="./src/css/estilo.css">
    <link rel="icon" type="image/icon-x" href="#">
</head>

<body>

    <header>
        <h1>Pomo dos Doros</h1>
    </header>

    <main class="doro-container"> <!-- <-- vai conter o site todo, basicamente -->
        <section id="relogio-container">
            <div id="fundo-relogio">
                <div id="display-relogio">
                    <h2 id="timerText">25:00</h2>
                    <div id="botoes-display">
                        <button type="button" class="btn-relogio" id="btn-play" onclick="pomodoro()">
                            Play
                        </button>
                        <button type="button" class="btn-relogio hide" id="btn-pause" onclick="pausarPomodoro()">
                            Pause
                        </button>
                        <button type="button" class="btn-relogio hide" id="btn-reset" onclick="resetPomodoro()">
                            Reset
                        </button>
                    </div>
                </div>
            </div>
        </section>
        <section class="ajustes-timer-container">
            <div id="fundo-ajustes">
                <div id="display-ajustes">

                    <div class="ajuste-scroll" id="ajuste-foco">
                        <input type="range" class="ajustes-pomo" id="inputFoco" value="25" max="75" min="5" oninput="atualizarInput()">
                        <h2 class="texto-ajuste" id="textFoco">25 min</h2>
                    </div>
                    <div class="ajuste-scroll" id="ajuste-pausa">
                        <input type="range" class="ajustes-pomo" id="inputPausa" value="5" max="25" min="1" oninput="atualizarInput()">
                        <h2 class="texto-ajuste" id="textPausa">5 min</h2>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <footer>

        <h3>Site muito épico</h3>
        <h4> Alvaro Andrade Santos &copy; - 2025 - Todos os Direitos reservados</h4>

    </footer>

    <script src="./src/js/script.js"></script>

</body>

</html>
